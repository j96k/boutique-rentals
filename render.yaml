# Render "Blueprint": tells Render how to run the backend (see deploy/ONLINE_GUIDE.md).
services:
  - type: web
    name: boutique-rentals
    runtime: python
    plan: free
    region: singapore          # closest free region to India
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: TZ               # boutique's local time (Render servers run in UTC otherwise)
        value: Asia/Kolkata
      - key: DB_TYPE
        value: postgres
      - key: DATABASE_URL     # paste the connection string from Neon when Render asks
        sync: false
      - key: JWT_SECRET       # Render makes a random secret for login tokens
        generateValue: true
      - key: JWT_EXPIRE_DAYS
        value: "30"
      - key: DONATE_UPI_ID    # your UPI ID for the donation pop-up, e.g. yourname@okhdfcbank
        sync: false
      - key: DONATE_NAME
        value: Boutique Rentals
      - key: ADMIN_USERNAMES  # your username: sees all ideas & requests
        sync: false
